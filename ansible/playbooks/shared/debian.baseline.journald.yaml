# An FSIAC reusable task to configure journald to not log audit
---
- name: Disable systemd-journald-audit.socket
  become: true
  ansible.builtin.systemd_service:
    name: systemd-journald-audit.socket
    state: stopped
    enabled: false
    masked: true

- name: Restart journald
  become: true
  ansible.builtin.systemd_service:
    name: systemd-journald.socket
    state: restarted
